<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Vendas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vendas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1512" media="(prefers-color-scheme: dark)">
<script src="config.js"></script>
<script>
  // Teste local (arquivo aberto do disco): carrega dados de mentira.
  if (location.protocol === 'file:') document.write('<script src="../dev/mock.js"><\/script>');
</script>
<style>
  :root {
    --bg: #faf7f4; --card: #ffffff; --ink: #2b211c; --muted: #7a6a60; --line: #eadfd6;
    --brand: #6b3e26; --brand-ink: #ffffff; --brand-soft: #f3e6dc;
    --ok: #1f7a4d; --ok-soft: #dcf1e5; --warn: #a3361f; --warn-soft: #fbe3dc;
    --radius: 14px; --shadow: 0 1px 2px rgba(60,30,10,.06), 0 4px 14px rgba(60,30,10,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1512; --card: #261e1a; --ink: #f3ebe5; --muted: #b3a197; --line: #3a2e28;
      --brand: #d79a6c; --brand-ink: #1b1512; --brand-soft: #3a2a20;
      --ok: #6fd3a0; --ok-soft: #1c3529; --warn: #f19a82; --warn-soft: #3d2019;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto;
    padding: calc(12px + env(safe-area-inset-top)) 16px 120px; }
  .acesso p { color: var(--muted); margin: 0 0 12px; font-size: 15px; }
  .acesso button { width: 100%; margin-top: 10px; border: 0; background: var(--brand); color: var(--brand-ink);
    font: inherit; font-weight: 700; padding: 14px; border-radius: 12px; }
  #btn-sair { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; padding: 0; }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 0 12px; }
  header h1 { margin: 0; font-size: 22px; }
  header small { color: var(--muted); }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--brand-soft);
    border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 14px; }
  .tabs button { border: 0; background: transparent; padding: 10px; border-radius: 9px;
    font: inherit; font-weight: 600; color: var(--muted); }
  .tabs button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

  section.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    border: 1px solid var(--line); padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 0 0 10px; font-weight: 700; }

  input[type=text], input[type=search], input[type=number], textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  input:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    padding: 8px 12px; border-radius: 999px; font: inherit; font-size: 15px; }
  .chip.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .chip.novo { border-style: dashed; color: var(--brand); }
  .selecionado { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--brand-soft); border-radius: 10px; padding: 10px 12px; font-weight: 600; }
  .selecionado button { border: 0; background: none; color: var(--muted); font: inherit; padding: 0 4px; }

  .cat { font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  .cat:first-child { margin-top: 0; }
  .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .sabor { position: relative; text-align: left; border: 1px solid var(--line); background: var(--bg);
    border-radius: 12px; padding: 12px; font: inherit; color: var(--ink); min-height: 64px; }
  .sabor b { display: block; font-size: 15px; }
  .sabor span { color: var(--muted); font-size: 14px; }
  .sabor .qtd { position: absolute; top: -6px; right: -6px; background: var(--brand); color: var(--brand-ink);
    min-width: 24px; height: 24px; border-radius: 12px; font-size: 13px; font-weight: 700;
    display: grid; place-items: center; padding: 0 6px; }
  .sabor:active { transform: scale(.98); }

  .item { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 10px 0;
    border-bottom: 1px solid var(--line); align-items: center; }
  .item:last-child { border-bottom: 0; }
  .item .nome { font-weight: 600; }
  .item .sub { text-align: right; font-weight: 600; }
  .controles { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; }
  .controles button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: 20px; line-height: 1; }
  .controles .n { min-width: 22px; text-align: center; font-weight: 700; }
  .controles label { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
  .controles input { width: 84px; padding: 6px 8px; text-align: right; }
  .vazio { color: var(--muted); font-size: 15px; margin: 0; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    padding: 12px; border-radius: 10px; font: inherit; font-weight: 600; }
  .seg button.on.pend { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .seg button.on.pago { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }

  .rodape { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .rodape button { display: block; width: 100%; max-width: 528px; margin: 0 auto; border: 0;
    background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 700; font-size: 17px;
    padding: 16px; border-radius: 14px; box-shadow: var(--shadow); }
  .rodape button:disabled { opacity: .45; }

  .resumo { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .resumo div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .resumo small { display: block; color: var(--muted); font-size: 12px; }
  .resumo b { font-size: 17px; font-variant-numeric: tabular-nums; }

  .venda { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .venda:last-child { border-bottom: 0; }
  .venda .topo { display: flex; justify-content: space-between; gap: 8px; }
  .venda .desc { color: var(--muted); font-size: 14px; }
  .pill { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.Pago { background: var(--ok-soft); color: var(--ok); }
  .pill.Pendente { background: var(--warn-soft); color: var(--warn); }
  .acoes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .acoes button { border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    padding: 7px 10px; border-radius: 9px; font: inherit; font-size: 14px; }
  .acoes button.perigo { color: var(--warn); }

  .toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -150%); transition: transform .25s;
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600;
    max-width: calc(100% - 32px); z-index: 10; }
  .toast.show { transform: translate(-50%, 0); }
  .toast.erro { background: var(--warn); color: #fff; }
  .carregando { text-align: center; color: var(--muted); padding: 40px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Vendas</h1>
    <small><span id="data"></span> · <button id="btn-sair" onclick="sair()">sair</button></small>
  </header>

  <div class="tabs" role="tablist">
    <button id="tab-nova" class="on" onclick="mostrarAba('nova')">Nova venda</button>
    <button id="tab-hoje" onclick="mostrarAba('hoje')">Hoje</button>
  </div>

  <div id="carregando" class="carregando">Carregando…</div>

  <section id="acesso" class="card acesso" hidden>
    <h2>Código de acesso</h2>
    <p>Digite uma vez o código de acesso. Ele fica guardado neste celular.</p>
    <input id="codigo" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"
      placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX">
    <button onclick="salvarCodigo()">Entrar</button>
  </section>

  <div id="aba-nova" hidden>
    <section class="card">
      <h2>Cliente</h2>
      <div id="cliente-escolhido" class="selecionado" hidden>
        <span id="cliente-nome"></span>
        <button onclick="trocarCliente()" aria-label="Trocar cliente">Trocar</button>
      </div>
      <div id="cliente-busca">
        <input id="busca" type="search" placeholder="Buscar ou digitar nome" autocomplete="off" oninput="renderClientes()">
        <div id="lista-clientes" class="chips"></div>
      </div>
    </section>

    <section class="card">
      <h2>Sabores</h2>
      <div id="sabores"></div>
    </section>

    <section class="card">
      <h2>Pedido</h2>
      <div id="carrinho"><p class="vazio">Toque nos sabores para adicionar.</p></div>
    </section>

    <section class="card">
      <h2>Pagamento</h2>
      <div class="seg">
        <button id="btn-pend" class="pend on" onclick="setPago(false)">Pendente</button>
        <button id="btn-pago" class="pago" onclick="setPago(true)">Já pagou</button>
      </div>
      <div id="formas" class="chips" hidden></div>
      <div style="margin-top:12px">
        <input id="obs" type="text" placeholder="Observação (opcional)">
      </div>
    </section>
  </div>

  <div id="aba-hoje" hidden>
    <div class="resumo">
      <div><small>Vendido hoje</small><b id="r-total">R$ 0,00</b></div>
      <div><small>Recebido</small><b id="r-pago">R$ 0,00</b></div>
      <div><small>Pendente</small><b id="r-pend">R$ 0,00</b></div>
    </div>
    <section class="card">
      <h2>Vendas de hoje</h2>
      <div id="lista-hoje"></div>
    </section>
  </div>
</main>

<div class="rodape" id="rodape" hidden>
  <button id="btn-registrar" onclick="registrar()" disabled>Registrar</button>
</div>
<div id="toast" class="toast"></div>

<script>
  const estado = {
    clientes: [], produtos: [], formas: [], hoje: [],
    cliente: null, novoCliente: false,
    itens: {},          // produto -> {qtd, preco}
    pago: false, forma: null,
    pagandoLinha: null, // linha da aba Hoje com escolha de forma aberta
    ocupado: false,
  };
  const MAX_CHIPS = 14;

  // ---------- código de acesso ----------
  const CHAVE = 'vendas.codigo';
  function lerCodigo() { try { return localStorage.getItem(CHAVE) || ''; } catch (e) { return ''; } }
  function gravarCodigo(c) { try { c ? localStorage.setItem(CHAVE, c) : localStorage.removeItem(CHAVE); } catch (e) {} }
  function pedirCodigo(msg) {
    $('carregando').hidden = true; $('acesso').hidden = false;
    $('aba-nova').hidden = true; $('aba-hoje').hidden = true; $('rodape').hidden = true;
    if (msg) toast(msg, true);
  }
  function salvarCodigo() {
    const c = $('codigo').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c.length < 20) { toast('Código incompleto.', true); return; }
    gravarCodigo(c); $('acesso').hidden = true; iniciar();
  }
  function sair() {
    if (!confirm('Esquecer o código de acesso neste celular?')) return;
    gravarCodigo(''); $('codigo').value = ''; pedirCodigo();
  }

  // ---------- chamada ao servidor ----------
  async function api(nome, ...args) {
    if (window.__mockApi) return window.__mockApi[nome](...args);
    let resp;
    try {
      const r = await fetch(window.CONFIG.apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight de CORS
        body: JSON.stringify({ token: lerCodigo(), acao: nome, args }),
      });
      resp = await r.json();
    } catch (e) {
      throw new Error('Sem conexão com a planilha. Tente de novo.');
    }
    if (!resp.ok) {
      if (resp.codigo === 'TOKEN') { gravarCodigo(''); pedirCodigo(resp.erro); }
      throw new Error(resp.erro || 'Erro desconhecido.');
    }
    return resp.data;
  }

  // ---------- util ----------
  const brl = v => 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const $ = id => document.getElementById(id);

  function toast(msg, erro) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (erro ? ' erro' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.className = 'toast'; }, erro ? 4000 : 2200);
  }
  function erro(e) { estado.ocupado = false; renderRodape(); toast((e && e.message) || String(e), true); }

  // ---------- início ----------
  $('data').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });
  function iniciar() {
    if (!window.__mockApi && !lerCodigo()) { pedirCodigo(); return; }
    $('carregando').hidden = false; $('carregando').textContent = 'Carregando…';
    api('getDadosIniciais').then(d => {
      Object.assign(estado, { clientes: d.clientes, produtos: d.produtos, formas: d.formas, hoje: d.hoje });
      $('carregando').hidden = true;
      mostrarAba('nova');
      renderClientes(); renderSabores(); renderCarrinho(); renderFormas(); renderHoje();
    }).catch(e => {
      if (!$('acesso').hidden) return; // já está pedindo o código
      $('carregando').innerHTML = esc('Erro ao carregar: ' + ((e && e.message) || e)) +
        '<br><br><button class="chip" onclick="iniciar()">Tentar de novo</button>';
    });
  }
  iniciar();

  function mostrarAba(aba) {
    $('aba-nova').hidden = aba !== 'nova';
    $('aba-hoje').hidden = aba !== 'hoje';
    $('rodape').hidden = aba !== 'nova';
    $('tab-nova').classList.toggle('on', aba === 'nova');
    $('tab-hoje').classList.toggle('on', aba === 'hoje');
  }

  // ---------- cliente ----------
  function renderClientes() {
    const q = norm($('busca').value);
    const lista = estado.clientes.filter(c => !q || norm(c.nome).includes(q)).slice(0, q ? 50 : MAX_CHIPS);
    let html = lista.map(c =>
      `<button class="chip" onclick='escolherCliente(${JSON.stringify(c.nome)}, false)'>${esc(c.nome)}</button>`).join('');
    const digitado = $('busca').value.trim();
    if (digitado && !estado.clientes.some(c => norm(c.nome) === norm(digitado))) {
      html += `<button class="chip novo" onclick='escolherCliente(${JSON.stringify(digitado)}, true)'>+ Novo: ${esc(digitado)}</button>`;
    }
    $('lista-clientes').innerHTML = html || '<p class="vazio">Nenhum cliente.</p>';
  }
  function escolherCliente(nome, novo) {
    estado.cliente = nome; estado.novoCliente = novo;
    $('cliente-nome').textContent = nome + (novo ? ' (novo)' : '');
    $('cliente-escolhido').hidden = false; $('cliente-busca').hidden = true;
    renderRodape();
  }
  function trocarCliente() {
    estado.cliente = null; estado.novoCliente = false;
    $('busca').value = ''; renderClientes();
    $('cliente-escolhido').hidden = true; $('cliente-busca').hidden = false;
    renderRodape();
  }

  // ---------- sabores e carrinho ----------
  function renderSabores() {
    const porCat = {};
    estado.produtos.forEach(p => (porCat[p.categoria || 'Outros'] = porCat[p.categoria || 'Outros'] || []).push(p));
    $('sabores').innerHTML = Object.keys(porCat).map(cat => `
      <div class="cat">${esc(cat)}</div>
      <div class="grade">${porCat[cat].map(p => {
        const q = estado.itens[p.nome] ? estado.itens[p.nome].qtd : 0;
        return `<button class="sabor" onclick='addItem(${JSON.stringify(p.nome)})'>
          <b>${esc(p.nome)}</b><span>${brl(p.preco)}</span>${q ? `<i class="qtd">${q}</i>` : ''}</button>`;
      }).join('')}</div>`).join('');
  }
  function addItem(nome, delta = 1) {
    const p = estado.produtos.find(x => x.nome === nome);
    const it = estado.itens[nome] || { qtd: 0, preco: p.preco };
    it.qtd += delta;
    if (it.qtd <= 0) delete estado.itens[nome]; else estado.itens[nome] = it;
    renderSabores(); renderCarrinho();
  }
  function setPreco(nome, valor) {
    const v = parseFloat(String(valor).replace(',', '.'));
    if (estado.itens[nome] && v > 0) estado.itens[nome].preco = v;
    renderCarrinhoTotais();
  }
  function totalPedido() {
    return Object.values(estado.itens).reduce((s, it) => s + it.qtd * it.preco, 0);
  }
  function renderCarrinho() {
    const nomes = Object.keys(estado.itens);
    $('carrinho').innerHTML = !nomes.length
      ? '<p class="vazio">Toque nos sabores para adicionar.</p>'
      : nomes.map(n => {
          const it = estado.itens[n], id = 'sub-' + norm(n).replace(/\W/g, '');
          return `<div class="item">
            <span class="nome">${esc(n)}</span><span class="sub" id="${id}">${brl(it.qtd * it.preco)}</span>
            <div class="controles">
              <button onclick='addItem(${JSON.stringify(n)}, -1)' aria-label="Menos">−</button>
              <span class="n">${it.qtd}</span>
              <button onclick='addItem(${JSON.stringify(n)}, 1)' aria-label="Mais">+</button>
              <label>R$ <input type="number" inputmode="decimal" step="0.5" min="0" value="${it.preco}"
                onchange='setPreco(${JSON.stringify(n)}, this.value)' oninput='setPreco(${JSON.stringify(n)}, this.value)'></label>
            </div></div>`;
        }).join('');
    renderRodape();
  }
  function renderCarrinhoTotais() {
    Object.keys(estado.itens).forEach(n => {
      const el = $('sub-' + norm(n).replace(/\W/g, ''));
      if (el) el.textContent = brl(estado.itens[n].qtd * estado.itens[n].preco);
    });
    renderRodape();
  }

  // ---------- pagamento ----------
  function setPago(p) {
    estado.pago = p;
    if (!p) estado.forma = null; else if (!estado.forma) estado.forma = 'Pix';
    $('btn-pend').classList.toggle('on', !p); $('btn-pago').classList.toggle('on', p);
    $('formas').hidden = !p; renderFormas(); renderRodape();
  }
  function renderFormas() {
    $('formas').innerHTML = estado.formas.map(f =>
      `<button class="chip ${estado.forma === f ? 'on' : ''}" onclick='estado.forma=${JSON.stringify(f)}; renderFormas(); renderRodape()'>${esc(f)}</button>`).join('');
  }

  function renderRodape() {
    const total = totalPedido();
    const ok = estado.cliente && total > 0 && (!estado.pago || estado.forma) && !estado.ocupado;
    const b = $('btn-registrar');
    b.disabled = !ok;
    b.textContent = estado.ocupado ? 'Salvando…' : (total > 0 ? 'Registrar · ' + brl(total) : 'Registrar');
  }

  function registrar() {
    if (estado.ocupado) return;
    const pedido = {
      cliente: estado.cliente, novoCliente: estado.novoCliente,
      itens: Object.keys(estado.itens).map(n => ({ produto: n, qtd: estado.itens[n].qtd, preco: estado.itens[n].preco })),
      pago: estado.pago, forma: estado.forma, obs: $('obs').value,
    };
    const resumo = estado.cliente + ' · ' + brl(totalPedido());
    estado.ocupado = true; renderRodape();
    api('registrarVenda', pedido).then(hoje => {
      if (estado.novoCliente) estado.clientes.push({ nome: estado.cliente, compras: 1 });
      estado.hoje = hoje; estado.ocupado = false;
      estado.itens = {}; $('obs').value = '';
      setPago(false); trocarCliente(); renderSabores(); renderCarrinho(); renderHoje();
      toast('Venda registrada: ' + resumo);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }).catch(erro);
  }

  // ---------- hoje ----------
  function renderHoje() {
    const h = estado.hoje;
    const tot = h.reduce((s, v) => s + v.total, 0);
    const pago = h.filter(v => v.status === 'Pago').reduce((s, v) => s + v.total, 0);
    $('r-total').textContent = brl(tot); $('r-pago').textContent = brl(pago); $('r-pend').textContent = brl(tot - pago);
    $('tab-hoje').textContent = h.length ? `Hoje (${h.length})` : 'Hoje';
    $('lista-hoje').innerHTML = !h.length ? '<p class="vazio">Nenhuma venda hoje ainda.</p>' :
      h.slice().reverse().map(v => `
        <div class="venda">
          <div class="topo"><b>${esc(v.cliente)}</b><span class="pill ${esc(v.status)}">${esc(v.status)}${v.forma ? ' · ' + esc(v.forma) : ''}</span></div>
          <div class="desc">${v.qtd > 1 ? v.qtd + 'x ' : ''}${esc(v.sabor)} · ${brl(v.total)}</div>
          <div class="acoes">
            ${estado.pagandoLinha === v.linha
              ? estado.formas.map(f => `<button onclick='pagar(${v.linha}, ${JSON.stringify(f)})'>${esc(f)}</button>`).join('') +
                `<button onclick='estado.pagandoLinha=null; renderHoje()'>Cancelar</button>`
              : (v.status === 'Pago'
                  ? `<button onclick='despagar(${v.linha})'>Voltar p/ pendente</button>`
                  : `<button onclick='estado.pagandoLinha=${v.linha}; renderHoje()'>Marcar pago</button>`) +
                `<button class="perigo" onclick='desfazer(${v.linha})'>Desfazer</button>`}
          </div>
        </div>`).join('');
  }
  const achar = linha => estado.hoje.find(v => v.linha === linha);
  function pagar(linha, forma) {
    const v = achar(linha);
    api('alterarPagamento', linha, v.conferencia, true, forma).then(h => {
      estado.hoje = h; estado.pagandoLinha = null; renderHoje(); toast(v.cliente + ': pago (' + forma + ')');
    }).catch(erro);
  }
  function despagar(linha) {
    const v = achar(linha);
    api('alterarPagamento', linha, v.conferencia, false, '').then(h => {
      estado.hoje = h; renderHoje(); toast(v.cliente + ': pendente');
    }).catch(erro);
  }
  function desfazer(linha) {
    const v = achar(linha);
    if (!confirm(`Apagar a venda de ${v.cliente} (${v.qtd}x ${v.sabor})?`)) return;
    api('desfazerVenda', linha, v.conferencia).then(h => {
      estado.hoje = h; renderHoje(); toast('Venda apagada');
    }).catch(erro);
  }
</script>
</body>
</html>
